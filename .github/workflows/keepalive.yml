name: Keep Alive Ping

on:
  schedule:
    - cron: "*/5 * * * *" # Runs every 5 minutes
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://lites-su1c.onrender.com/v1/lites/metrics || true
          echo " Pung Render Backend"

      - name: Ping Vercel Frontend
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://lites-frontend.vercel.app/ || true
          echo " Pung Vercel Frontend"
