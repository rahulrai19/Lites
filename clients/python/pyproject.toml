[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lites"
version = "0.1.0"
description = "Official SDK and CLI for Lites - The lightning-fast AI proxy"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.110.0"
]

[project.scripts]
lites = "lites.cli:app"

[tool.setuptools.packages.find]
include = ["lites*"]
