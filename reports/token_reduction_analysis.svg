<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="850" height="520">
<defs>
  <style>
    .bg { fill: #0a111a; }
    .card-bg { fill: #111b27; stroke: rgba(255,255,255,0.08); stroke-width: 1px; rx: 12px; }
    .grid-line { stroke: rgba(255,255,255,0.06); stroke-dasharray: 4,4; stroke-width: 1px; }
    .axis-line { stroke: rgba(255,255,255,0.2); stroke-width: 1.5px; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
    .chart-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; font-weight: 800; fill: #ffffff; letter-spacing: -0.02em; }
    .chart-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #e2e8f0; }
    .val-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    .accent-pill { fill: rgba(239, 68, 68, 0.15); stroke: #ef4444; stroke-width: 1px; rx: 6px; }
    .green-pill { fill: rgba(16, 185, 129, 0.15); stroke: #10b981; stroke-width: 1px; rx: 6px; }
    .blue-pill { fill: rgba(6, 182, 212, 0.15); stroke: #06b6d4; stroke-width: 1px; rx: 6px; }
  </style>
  <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#0891b2" stop-opacity="0.7"/>
  </linearGradient>
  <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#10b981" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#059669" stop-opacity="0.75"/>
  </linearGradient>
  <linearGradient id="crimsonGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.7"/>
  </linearGradient>
  <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#d97706" stop-opacity="0.7"/>
  </linearGradient>
  <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.7"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
</defs>
<rect width="100%" height="100%" class="bg"/>
<rect x="18" y="18" width="814" height="484" class="card-bg"/>

<text x="45" y="55" class="chart-title">Token Reduction Analysis</text>
<text x="45" y="75" class="chart-subtitle">Prompt tokens before vs. after Lites deterministic rules, context pruning, and AI compression</text>
<rect x="640" y="42" width="165" height="36" class="green-pill"/>
<text x="722" y="64" class="val-label" fill="#10b981" font-size="13">Avg. Savings: 41.6%</text>
<line x1="240" y1="430.0" x2="790" y2="430.0" class="grid-line"/>
<text x="228" y="434.0" class="axis-label" text-anchor="end">0 tk</text>
<line x1="240" y1="366.0" x2="790" y2="366.0" class="grid-line"/>
<text x="228" y="370.0" class="axis-label" text-anchor="end">1,040 tk</text>
<line x1="240" y1="302.0" x2="790" y2="302.0" class="grid-line"/>
<text x="228" y="306.0" class="axis-label" text-anchor="end">2,080 tk</text>
<line x1="240" y1="238.0" x2="790" y2="238.0" class="grid-line"/>
<text x="228" y="242.0" class="axis-label" text-anchor="end">3,120 tk</text>
<line x1="240" y1="174.0" x2="790" y2="174.0" class="grid-line"/>
<text x="228" y="178.0" class="axis-label" text-anchor="end">4,160 tk</text>
<line x1="240" y1="110.0" x2="790" y2="110.0" class="grid-line"/>
<text x="228" y="114.0" class="axis-label" text-anchor="end">5,200 tk</text>
<line x1="240" y1="110" x2="240" y2="430" class="axis-line"/>
<line x1="240" y1="430" x2="790" y2="430" class="axis-line"/>
<text x="225" y="138.0" class="axis-title" text-anchor="end" font-size="11">Short Chat Queries (<200 tokens)</text>
<rect x="240" y="124.0" width="17.451923076923077" height="16" rx="3" fill="url(#crimsonGrad)"/>
<text x="265.4519230769231" y="136.0" class="axis-label" fill="#f87171" font-weight="600">165</text>
<rect x="240" y="144.0" width="13.538461538461538" height="16" rx="3" fill="url(#emeraldGrad)"/>
<text x="261.53846153846155" y="156.0" class="axis-label" fill="#34d399" font-weight="600">128 (-22.4%)</text>
<text x="225" y="202.0" class="axis-title" text-anchor="end" font-size="11">Verbose System Instructions</text>
<rect x="240" y="188.0" width="88.84615384615385" height="16" rx="3" fill="url(#crimsonGrad)"/>
<text x="336.84615384615387" y="200.0" class="axis-label" fill="#f87171" font-weight="600">840</text>
<rect x="240" y="208.0" width="51.29807692307693" height="16" rx="3" fill="url(#emeraldGrad)"/>
<text x="299.2980769230769" y="220.0" class="axis-label" fill="#34d399" font-weight="600">485 (-42.3%)</text>
<text x="225" y="266.0" class="axis-title" text-anchor="end" font-size="11">Code & Technical Context</text>
<rect x="240" y="252.0" width="150.19230769230768" height="16" rx="3" fill="url(#crimsonGrad)"/>
<text x="398.1923076923077" y="264.0" class="axis-label" fill="#f87171" font-weight="600">1,420</text>
<rect x="240" y="272.0" width="120.57692307692308" height="16" rx="3" fill="url(#emeraldGrad)"/>
<text x="368.5769230769231" y="284.0" class="axis-label" fill="#34d399" font-weight="600">1,140 (-19.7%)</text>
<text x="225" y="330.0" class="axis-title" text-anchor="end" font-size="11">Multi-turn History (4k window)</text>
<rect x="240" y="316.0" width="327.88461538461536" height="16" rx="3" fill="url(#crimsonGrad)"/>
<text x="575.8846153846154" y="328.0" class="axis-label" fill="#f87171" font-weight="600">3,100</text>
<rect x="240" y="336.0" width="167.1153846153846" height="16" rx="3" fill="url(#emeraldGrad)"/>
<text x="415.11538461538464" y="348.0" class="axis-label" fill="#34d399" font-weight="600">1,580 (-49.0%)</text>
<text x="225" y="394.0" class="axis-title" text-anchor="end" font-size="11">Enterprise RAG Documents</text>
<rect x="240" y="380.0" width="512.9807692307693" height="16" rx="3" fill="url(#crimsonGrad)"/>
<text x="760.9807692307693" y="392.0" class="axis-label" fill="#f87171" font-weight="600">4,850</text>
<rect x="240" y="400.0" width="291.9230769230769" height="16" rx="3" fill="url(#emeraldGrad)"/>
<text x="539.9230769230769" y="412.0" class="axis-label" fill="#34d399" font-weight="600">2,760 (-43.1%)</text>

    <g transform="translate(260, 485)">
      <rect x="0" y="0" width="14" height="14" rx="2" fill="url(#crimsonGrad)"/>
      <text x="22" y="11" class="legend-text">Baseline (Uncompressed)</text>
      
      <rect x="220" y="0" width="14" height="14" rx="2" fill="url(#emeraldGrad)"/>
      <text x="242" y="11" class="legend-text">Lites Optimized (-41.6% Avg)</text>
    </g>
    
</svg>