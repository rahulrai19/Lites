<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="850" height="520">
<defs>
  <style>
    .bg { fill: #0a111a; }
    .card-bg { fill: #111b27; stroke: rgba(255,255,255,0.08); stroke-width: 1px; rx: 12px; }
    .grid-line { stroke: rgba(255,255,255,0.06); stroke-dasharray: 4,4; stroke-width: 1px; }
    .axis-line { stroke: rgba(255,255,255,0.2); stroke-width: 1.5px; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
    .chart-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; font-weight: 800; fill: #ffffff; letter-spacing: -0.02em; }
    .chart-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #e2e8f0; }
    .val-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    .accent-pill { fill: rgba(239, 68, 68, 0.15); stroke: #ef4444; stroke-width: 1px; rx: 6px; }
    .green-pill { fill: rgba(16, 185, 129, 0.15); stroke: #10b981; stroke-width: 1px; rx: 6px; }
    .blue-pill { fill: rgba(6, 182, 212, 0.15); stroke: #06b6d4; stroke-width: 1px; rx: 6px; }
  </style>
  <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#0891b2" stop-opacity="0.7"/>
  </linearGradient>
  <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#10b981" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#059669" stop-opacity="0.75"/>
  </linearGradient>
  <linearGradient id="crimsonGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.7"/>
  </linearGradient>
  <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#d97706" stop-opacity="0.7"/>
  </linearGradient>
  <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.7"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
</defs>
<rect width="100%" height="100%" class="bg"/>
<rect x="18" y="18" width="814" height="484" class="card-bg"/>

<text x="45" y="55" class="chart-title">Latency Analysis (P50, P90, P99)</text>
<text x="45" y="75" class="chart-subtitle">End-to-end response time across caching, adaptive routing, and upstream execution tiers</text>
<rect x="625" y="42" width="180" height="36" class="cyan-pill" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1" rx="6"/>
<text x="715" y="64" class="val-label" fill="#06b6d4" font-size="13">Cache Hit: &lt;15ms (180x)</text>
<line x1="240.0" y1="110" x2="240.0" y2="420" class="grid-line"/>
<text x="240.0" y="438" class="axis-label" text-anchor="middle">0 ms</text>
<line x1="308.75" y1="110" x2="308.75" y2="420" class="grid-line"/>
<text x="308.75" y="438" class="axis-label" text-anchor="middle">500 ms</text>
<line x1="377.5" y1="110" x2="377.5" y2="420" class="grid-line"/>
<text x="377.5" y="438" class="axis-label" text-anchor="middle">1,000 ms</text>
<line x1="515.0" y1="110" x2="515.0" y2="420" class="grid-line"/>
<text x="515.0" y="438" class="axis-label" text-anchor="middle">2,000 ms</text>
<line x1="652.5" y1="110" x2="652.5" y2="420" class="grid-line"/>
<text x="652.5" y="438" class="axis-label" text-anchor="middle">3,000 ms</text>
<line x1="790.0" y1="110" x2="790.0" y2="420" class="grid-line"/>
<text x="790.0" y="438" class="axis-label" text-anchor="middle">4,000 ms</text>
<line x1="240" y1="110" x2="240" y2="420" class="axis-line"/>
<line x1="240" y1="420" x2="790" y2="420" class="axis-line"/>
<text x="225" y="143.0" class="axis-title" text-anchor="end" font-size="11.5">Exact Cache Hit (Redis)</text>
<rect x="240" y="125.5" width="4" height="9" rx="2" fill="url(#cyanGrad)"/>
<rect x="240" y="136.5" width="4" height="9" rx="2" fill="url(#amberGrad)"/>
<rect x="240" y="147.5" width="4" height="9" rx="2" fill="url(#crimsonGrad)"/>
<text x="254" y="145.0" class="axis-label" fill="#e2e8f0" font-weight="600">11.8ms (P50) / 18ms (P99)</text>
<text x="225" y="205.0" class="axis-title" text-anchor="end" font-size="11.5">Semantic Cache (Vector)</text>
<rect x="240" y="187.5" width="4.2625" height="9" rx="2" fill="url(#cyanGrad)"/>
<rect x="240" y="198.5" width="5.84375" height="9" rx="2" fill="url(#amberGrad)"/>
<rect x="240" y="209.5" width="7.9750000000000005" height="9" rx="2" fill="url(#crimsonGrad)"/>
<text x="257.975" y="207.0" class="axis-label" fill="#e2e8f0" font-weight="600">31.0ms (P50) / 58ms (P99)</text>
<text x="225" y="267.0" class="axis-title" text-anchor="end" font-size="11.5">Flash Routed (Gemini)</text>
<rect x="240" y="249.5" width="46.75" height="9" rx="2" fill="url(#cyanGrad)"/>
<rect x="240" y="260.5" width="66.0" height="9" rx="2" fill="url(#amberGrad)"/>
<rect x="240" y="271.5" width="83.875" height="9" rx="2" fill="url(#crimsonGrad)"/>
<text x="333.875" y="269.0" class="axis-label" fill="#e2e8f0" font-weight="600">340.0ms (P50) / 610ms (P99)</text>
<text x="225" y="329.0" class="axis-title" text-anchor="end" font-size="11.5">Optimized Upstream (GPT-4o)</text>
<rect x="240" y="311.5" width="140.25" height="9" rx="2" fill="url(#cyanGrad)"/>
<rect x="240" y="322.5" width="203.5" height="9" rx="2" fill="url(#amberGrad)"/>
<rect x="240" y="333.5" width="259.875" height="9" rx="2" fill="url(#crimsonGrad)"/>
<text x="509.875" y="331.0" class="axis-label" fill="#e2e8f0" font-weight="600">1020.0ms (P50) / 1890ms (P99)</text>
<text x="225" y="391.0" class="axis-title" text-anchor="end" font-size="11.5">Baseline Cold (GPT-4o)</text>
<rect x="240" y="373.5" width="295.625" height="9" rx="2" fill="url(#cyanGrad)"/>
<rect x="240" y="384.5" width="397.375" height="9" rx="2" fill="url(#amberGrad)"/>
<rect x="240" y="395.5" width="515.625" height="9" rx="2" fill="url(#crimsonGrad)"/>
<text x="765.625" y="393.0" class="axis-label" fill="#e2e8f0" font-weight="600">2150.0ms (P50) / 3750ms (P99)</text>

    <g transform="translate(240, 485)">
      <rect x="0" y="0" width="14" height="14" rx="2" fill="url(#cyanGrad)"/>
      <text x="22" y="11" class="legend-text">P50 (Median)</text>
      
      <rect x="150" y="0" width="14" height="14" rx="2" fill="url(#amberGrad)"/>
      <text x="172" y="11" class="legend-text">P90</text>
      
      <rect x="260" y="0" width="14" height="14" rx="2" fill="url(#crimsonGrad)"/>
      <text x="282" y="11" class="legend-text">P99</text>
    </g>
    
</svg>