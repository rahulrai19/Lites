[project]
name = "lites"
version = "0.1.0"
description = "Intelligent LLM Token Optimization Platform"
authors = [{ name = "Rahul Rai", email = "rahulrai19@example.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "tiktoken>=0.6.0",
    "httpx>=0.27.0",
    "redis>=5.0.1",
    "motor>=3.3.2"
]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
