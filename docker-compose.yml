services:
  lites:
    build:
      context: .
      target: runtime
    image: lites:local
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: info
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
