version: '3.8'

services:
  # The Redis cache for exactly matching and semantic similarity
  redis:
    image: redis:alpine
    container_name: lites-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # The Lites Python Proxy API
  lites-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lites-proxy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override Redis URL to point to the docker network container name
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  # The React Dashboard running on Nginx
  lites-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lites-dashboard
    ports:
      - "5173:80"  # Expose Nginx on port 5173 to match Vite's default dev port
    env_file:
      - .env
    depends_on:
      - lites-proxy
    restart: unless-stopped

volumes:
  redis_data:
